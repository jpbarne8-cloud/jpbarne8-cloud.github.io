<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPB PORTFOLIO WK3</title>

    <style>
        body {
            background-color: #E76F51;
            font-family: Exo 2, Inter;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0; 
        }
        .card {
            width: 500px;
            height: 750px;
            background-color: #F4A261
            padding 36px;
            border-radius: 12px;
            box-shadow: 0 4px 15px;
            box-sizing: border-box;
        }
         .card img {
            width: 100%;
            height: 300px;
            object-fit: cover; 
            border-radius: 8px; 
            margin-bottom: 12px;
        }
        .card h1 {
            font-family: 'Playfair Display', serif;
            color: #1a365d;
            font-size: 2.5rem;
            margin-top: 12px;
            margin-bottom: 8px;
        }
        .card p {
            font-size: 1rem;
            color: #E76F51;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .card-button {
            display: inline-block;
            background-color: #E76F51;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .card-button:hover {
            background-color: #2b6cb0;
        }
        /* The style generated with chatGPT with the prompt: "my style is not loading, what code would work?" */
    </style> 
</head>
<body>
    <div class="card">
        <img src="RDR2.webp">
        <h1>This is a town in one of my favorite video games, Red Dead Redemption 2!</h1>
        <p>This city is the bigges in the entire game and the closest to a modern city!</p>
        <a href="https://reddead.fandom.com/wiki/Saint_Denis?file=SaintDenis.jpg"> </a>
    </div>
</body>
</html>
